<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart - E-Commerce Store</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/cart.css">
</head>
<body>
    <header>
        <div class="container">
            <nav class="navbar">
                <h1 class="logo">E-Store</h1>
                <ul class="nav-links">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="index.html#products">Products</a></li>
                    <li><a href="cart.html" class="active">Cart <span id="cart-count" class="cart-badge">0</span></a></li>
                    <li><a href="multi-step-checkout.html">Checkout</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main>
        <section class="cart-section">
            <div class="container">
                <div class="cart-container">
                    <h2>Shopping Cart</h2>
                    <div id="cart-container">
                        <!-- Cart items will be dynamically loaded here -->
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2026 E-Store. All rights reserved.</p>
        </div>
    </footer>

    <script type="module">
        import { renderCart, updateCartCount } from './js/cart.js';

        // Initialize cart page
        updateCartCount();
        renderCart('cart-container');
    </script>
</body>
</html>
