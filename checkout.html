<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - E-Commerce Store</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/checkout.css">
</head>
<body>
    <header>
        <div class="container">
            <nav class="navbar">
                <h1 class="logo">E-Store</h1>
                <ul class="nav-links">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="index.html#products">Products</a></li>
                    <li><a href="cart.html">Cart <span id="cart-count" class="cart-badge">0</span></a></li>
                    <li><a href="checkout.html" class="active">Checkout</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main>
        <section class="checkout-section">
            <div class="container">
                <div class="checkout-container">
                    <h2>Checkout</h2>
                    <div class="checkout-grid">
                        <div class="checkout-form-container">
                            <form id="checkout-form" class="checkout-form">
                                <div class="form-section">
                                    <h3>Contact Information</h3>
                                    <div class="form-group">
                                        <label for="fullName">Full Name *</label>
                                        <input type="text" id="fullName" name="fullName" required>
                                    </div>
                                    <div class="form-group">
                                        <label for="email">Email Address *</label>
                                        <input type="email" id="email" name="email" required>
                                    </div>
                                    <div class="form-group">
                                        <label for="phone">Phone Number *</label>
                                        <input type="tel" id="phone" name="phone" required>
                                    </div>
                                </div>

                                <div class="form-section">
                                    <h3>Shipping Address</h3>
                                    <div class="form-group">
                                        <label for="address">Street Address *</label>
                                        <input type="text" id="address" name="address" required>
                                    </div>
                                    <div class="form-row">
                                        <div class="form-group">
                                            <label for="city">City *</label>
                                            <input type="text" id="city" name="city" required>
                                        </div>
                                        <div class="form-group">
                                            <label for="state">State *</label>
                                            <select id="state" name="state" required>
                                                <option value="">Select State</option>
                                                <option value="CA">California</option>
                                                <option value="NY">New York</option>
                                                <option value="TX">Texas</option>
                                                <option value="FL">Florida</option>
                                                <option value="IL">Illinois</option>
                                            </select>
                                        </div>
                                    </div>
                                    <div class="form-group">
                                        <label for="zip">ZIP Code *</label>
                                        <input type="text" id="zip" name="zip" required>
                                    </div>
                                </div>

                                <div class="form-section">
                                    <h3>Payment Information</h3>
                                    <div class="form-group">
                                        <label for="cardNumber">Card Number *</label>
                                        <input type="text" id="cardNumber" name="cardNumber" placeholder="1234 5678 9012 3456" required>
                                    </div>
                                    <div class="form-group">
                                        <label for="cardName">Name on Card *</label>
                                        <input type="text" id="cardName" name="cardName" required>
                                    </div>
                                    <div class="form-row">
                                        <div class="form-group">
                                            <label for="expiryDate">Expiry Date *</label>
                                            <input type="text" id="expiryDate" name="expiryDate" placeholder="MM/YY" required>
                                        </div>
                                        <div class="form-group">
                                            <label for="cvv">CVV *</label>
                                            <input type="text" id="cvv" name="cvv" placeholder="123" required>
                                        </div>
                                    </div>
                                </div>

                                <button type="submit" class="btn btn-success place-order-btn">Place Order</button>
                            </form>
                        </div>

                        <div id="order-summary" class="order-summary">
                            <!-- Order summary will be dynamically loaded here -->
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2026 E-Store. All rights reserved.</p>
        </div>
    </footer>

    <script type="module">
        import { renderOrderSummary, setupCheckoutForm } from './js/checkout.js';
        import { updateCartCount } from './js/cart.js';

        // Initialize checkout page
        updateCartCount();
        renderOrderSummary('order-summary');
        setupCheckoutForm();
    </script>
</body>
</html>
