<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Commerce Test Runner</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a1a;
            color: #fff;
            padding: 2rem;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 3rem;
        }

        h1 {
            font-size: 3rem;
            margin-bottom: 0.5rem;
        }

        .subtitle {
            color: #888;
            font-size: 1.125rem;
        }

        .controls {
            display: flex;
            gap: 1rem;
            justify-content: center;
            margin-bottom: 2rem;
        }

        button {
            padding: 0.75rem 1.5rem;
            font-size: 1rem;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #333;
            color: white;
        }

        .btn-secondary:hover {
            background: #444;
        }

        .progress {
            background: #2a2a2a;
            border-radius: 8px;
            padding: 1rem;
            margin-bottom: 2rem;
            display: none;
        }

        .progress.active {
            display: block;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: #333;
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 0.5rem;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            width: 0%;
            transition: width 0.3s;
        }

        .progress-text {
            font-size: 0.875rem;
            color: #888;
        }

        #console {
            background: #0d0d0d;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 1.5rem;
            font-family: 'Monaco', 'Menlo', monospace;
            font-size: 0.875rem;
            min-height: 400px;
            max-height: 600px;
            overflow-y: auto;
            margin-bottom: 2rem;
        }

        .log-line {
            margin-bottom: 0.25rem;
            white-space: pre-wrap;
        }

        .log-info { color: #888; }
        .log-success { color: #4caf50; }
        .log-error { color: #f44336; }
        .log-warning { color: #ff9800; }
        .log-test { color: #2196f3; }

        .summary {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-top: 2rem;
        }

        .stat-card {
            background: #2a2a2a;
            border-radius: 8px;
            padding: 1.5rem;
            text-align: center;
        }

        .stat-value {
            font-size: 2.5rem;
            font-weight: bold;
            margin-bottom: 0.5rem;
        }

        .stat-label {
            color: #888;
            font-size: 0.875rem;
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🧪 E-Commerce Test Suite</h1>
            <p class="subtitle">Comprehensive testing for your e-commerce platform</p>
        </header>

        <div class="controls">
            <button id="run-all" class="btn-primary">▶️ Run All Tests</button>
            <button id="clear-console" class="btn-secondary">🗑️ Clear Console</button>
            <button id="export-results" class="btn-secondary hidden">📄 Export Results</button>
        </div>

        <div id="progress" class="progress">
            <div class="progress-bar">
                <div id="progress-fill" class="progress-fill"></div>
            </div>
            <div id="progress-text" class="progress-text">Initializing tests...</div>
        </div>

        <div id="console"></div>

        <div id="summary" class="summary hidden">
            <div class="stat-card">
                <div id="total-tests" class="stat-value">0</div>
                <div class="stat-label">Total Tests</div>
            </div>
            <div class="stat-card">
                <div id="passed-tests" class="stat-value" style="color: #4caf50;">0</div>
                <div class="stat-label">Passed</div>
            </div>
            <div class="stat-card">
                <div id="failed-tests" class="stat-value" style="color: #f44336;">0</div>
                <div class="stat-label">Failed</div>
            </div>
            <div class="stat-card">
                <div id="duration" class="stat-value">0ms</div>
                <div class="stat-label">Duration</div>
            </div>
            <div class="stat-card">
                <div id="pass-rate" class="stat-value">0%</div>
                <div class="stat-label">Pass Rate</div>
            </div>
        </div>
    </div>

    <script type="module">
        import { runAllTests } from './run-all-tests.js';

        const consoleElement = document.getElementById('console');
        const progressElement = document.getElementById('progress');
        const progressFill = document.getElementById('progress-fill');
        const progressText = document.getElementById('progress-text');
        const summaryElement = document.getElementById('summary');

        let testResults = null;

        // Override console.log to display in UI
        const originalLog = console.log;
        const originalError = console.error;
        const originalWarn = console.warn;

        console.log = (...args) => {
            originalLog(...args);
            const message = args.join(' ');
            addLogLine(message, getLogClass(message));
        };

        console.error = (...args) => {
            originalError(...args);
            const message = args.join(' ');
            addLogLine(message, 'log-error');
        };

        console.warn = (...args) => {
            originalWarn(...args);
            const message = args.join(' ');
            addLogLine(message, 'log-warning');
        };

        function getLogClass(message) {
            if (message.includes('✅') || message.includes('passed') || message.includes('PASSED')) {
                return 'log-success';
            }
            if (message.includes('❌') || message.includes('failed') || message.includes('FAILED')) {
                return 'log-error';
            }
            if (message.includes('Running')) {
                return 'log-test';
            }
            return 'log-info';
        }

        function addLogLine(message, className = 'log-info') {
            const line = document.createElement('div');
            line.className = `log-line ${className}`;
            line.textContent = message;
            consoleElement.appendChild(line);
            consoleElement.scrollTop = consoleElement.scrollHeight;
        }

        function updateProgress(percent, text) {
            progressFill.style.width = percent + '%';
            progressText.textContent = text;
        }

        function updateSummary(results) {
            document.getElementById('total-tests').textContent = results.totalTests;
            document.getElementById('passed-tests').textContent = results.totalPassed;
            document.getElementById('failed-tests').textContent = results.totalFailed;
            document.getElementById('duration').textContent = results.duration + 'ms';

            const passRate = ((results.totalPassed / results.totalTests) * 100).toFixed(1);
            document.getElementById('pass-rate').textContent = passRate + '%';

            summaryElement.classList.remove('hidden');
        }

        // Run All Tests button
        document.getElementById('run-all').addEventListener('click', async () => {
            consoleElement.innerHTML = '';
            progressElement.classList.add('active');
            summaryElement.classList.add('hidden');
            document.getElementById('export-results').classList.add('hidden');

            updateProgress(0, 'Starting test suite...');

            try {
                // Run tests
                const results = await runAllTests();

                testResults = results;

                updateProgress(100, 'Tests complete!');
                updateSummary(results);

                document.getElementById('export-results').classList.remove('hidden');

                setTimeout(() => {
                    progressElement.classList.remove('active');
                }, 2000);
            } catch (error) {
                console.error('Test suite failed:', error);
                updateProgress(0, 'Test suite failed');
            }
        });

        // Clear Console button
        document.getElementById('clear-console').addEventListener('click', () => {
            consoleElement.innerHTML = '';
            progressElement.classList.remove('active');
            summaryElement.classList.add('hidden');
        });

        // Export Results button
        document.getElementById('export-results').addEventListener('click', () => {
            if (!testResults) return;

            const json = JSON.stringify(testResults, null, 2);
            const blob = new Blob([json], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `test-results-${Date.now()}.json`;
            a.click();
            URL.revokeObjectURL(url);

            console.log('Results exported successfully');
        });

        // Welcome message
        addLogLine('🧪 E-Commerce Test Suite Ready', 'log-success');
        addLogLine('Click "Run All Tests" to start testing', 'log-info');
        addLogLine('', 'log-info');
    </script>
</body>
</html>
